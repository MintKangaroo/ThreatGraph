<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">ThreatGraph 대시보드 미리보기</title>
  <desc id="desc">어두운 배경의 ThreatGraph 랜딩 화면과 API 상태, 기반 서비스를 보여주는 화면</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101a2a"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#1b769b" stop-opacity=".45"/><stop offset="1" stop-color="#07111f" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1440" height="820" fill="url(#bg)"/>
  <circle cx="300" cy="100" r="440" fill="url(#glow)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="110" y="190" fill="#5eead4" font-size="18" font-weight="700" letter-spacing="5">THREAT INTELLIGENCE GRAPH</text>
    <text x="105" y="315" fill="#f6fbff" font-size="112" font-weight="750" letter-spacing="-7">ThreatGraph</text>
    <text x="112" y="375" fill="#9fb3c9" font-size="24">AI-SOC Dashboard, AutoPentest AI, SentinelFlow를 위한</text>
    <text x="112" y="412" fill="#9fb3c9" font-size="24">공통 위협 인텔리전스 그래프 분석 계층</text>
    <rect x="112" y="465" width="180" height="48" rx="24" fill="#081321" stroke="#253950"/>
    <circle cx="140" cy="489" r="7" fill="#4ade80"/><text x="160" y="496" fill="#a9bbcc" font-size="15">API AVAILABLE</text>
    <rect x="865" y="150" width="430" height="480" rx="22" fill="#0a192b" fill-opacity=".88" stroke="#4b6c8a" stroke-opacity=".55"/>
    <text x="905" y="210" fill="#eff7ff" font-size="21" font-weight="700">Platform foundation</text>
    <g font-size="19" fill="#c4d5e5">
      <rect x="905" y="255" width="350" height="62" fill="#0e2439"/><rect x="905" y="255" width="3" height="62" fill="#2dd4bf"/><text x="930" y="294">PostgreSQL metadata store</text>
      <rect x="905" y="335" width="350" height="62" fill="#0e2439"/><rect x="905" y="335" width="3" height="62" fill="#2dd4bf"/><text x="930" y="374">Neo4j graph store</text>
      <rect x="905" y="415" width="350" height="62" fill="#0e2439"/><rect x="905" y="415" width="3" height="62" fill="#2dd4bf"/><text x="930" y="454">Redis + Celery runtime</text>
    </g>
    <text x="905" y="540" fill="#7890a8" font-size="15">Interactive graph explorer is on the roadmap.</text>
  </g>
</svg>
