<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">ThreatGraph data flow and architecture</title>
  <desc id="desc">Security data moves through STIX validation and IOC normalization into an evidence-backed Neo4j graph, then through a bounded FastAPI query layer to the investigation dashboard.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a0f16"/>
      <stop offset="1" stop-color="#0d141c"/>
    </linearGradient>
    <linearGradient id="mint-card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#132720"/>
      <stop offset="1" stop-color="#101a1a"/>
    </linearGradient>
    <linearGradient id="graph-card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172032"/>
      <stop offset="1" stop-color="#121923"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#26313d" opacity=".45"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#52e2bc"/>
    </marker>
  </defs>

  <rect width="1440" height="560" rx="24" fill="url(#background)"/>
  <rect width="1440" height="560" rx="24" fill="url(#dots)"/>
  <path d="M0 0h1440v560H0z" fill="none" stroke="#25303c"/>

  <g font-family="Inter, Pretendard, Arial, sans-serif">
    <text x="60" y="61" fill="#52e2bc" font-size="13" font-weight="700" letter-spacing="3">EVIDENCE-FIRST PIPELINE</text>
    <text x="60" y="94" fill="#f1f5f9" font-size="27" font-weight="700">From raw security signals to an explainable threat graph</text>
    <text x="60" y="120" fill="#718090" font-size="13">Every entity is workspace-scoped. Every relationship is backed by Evidence.</text>

    <!-- section labels -->
    <g font-size="10" font-weight="700" letter-spacing="1.6">
      <text x="61" y="163" fill="#718090">01 · COLLECT</text>
      <text x="355" y="163" fill="#718090">02 · NORMALIZE</text>
      <text x="702" y="163" fill="#718090">03 · CORRELATE</text>
      <text x="1082" y="163" fill="#718090">04 · INVESTIGATE</text>
    </g>

    <!-- input card -->
    <rect x="60" y="180" width="244" height="210" rx="14" fill="#111821" stroke="#2a3542"/>
    <g transform="translate(80 201)">
      <rect width="204" height="49" rx="9" fill="#151f2a" stroke="#2d3a48"/>
      <circle cx="24" cy="24.5" r="11" fill="#192d3e" stroke="#477597"/>
      <path d="M19 24h10M24 19v11" stroke="#74b8e8" stroke-width="1.5" stroke-linecap="round"/>
      <text x="45" y="21" fill="#d4dde6" font-size="12" font-weight="650">STIX 2.1 / TAXII</text>
      <text x="45" y="36" fill="#657383" font-size="9">Threat intelligence bundles</text>
    </g>
    <g transform="translate(80 261)">
      <rect width="204" height="49" rx="9" fill="#151f2a" stroke="#2d3a48"/>
      <circle cx="24" cy="24.5" r="11" fill="#2b1d28" stroke="#77465d"/>
      <path d="m18 27 4-5 4 3 4-7" fill="none" stroke="#f080aa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="45" y="21" fill="#d4dde6" font-size="12" font-weight="650">SIEM / EDR events</text>
      <text x="45" y="36" fill="#657383" font-size="9">Assets, alerts, identities</text>
    </g>
    <g transform="translate(80 321)">
      <rect width="204" height="49" rx="9" fill="#151f2a" stroke="#2d3a48"/>
      <circle cx="24" cy="24.5" r="11" fill="#28251a" stroke="#6b6035"/>
      <path d="M18 25h12M21 21l-3 4 3 4M27 21l3 4-3 4" fill="none" stroke="#e5bd67" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="45" y="21" fill="#d4dde6" font-size="12" font-weight="650">IOC feeds</text>
      <text x="45" y="36" fill="#657383" font-size="9">IP, domain, URL, hash</text>
    </g>

    <!-- normalize card -->
    <rect x="350" y="180" width="302" height="210" rx="14" fill="url(#mint-card)" stroke="#2c5047"/>
    <circle cx="389" cy="219" r="18" fill="#16342d" stroke="#347565"/>
    <path d="m381 219 6 6 11-13" fill="none" stroke="#52e2bc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="419" y="215" fill="#e3ebe9" font-size="14" font-weight="700">Ingestion boundary</text>
    <text x="419" y="232" fill="#68817b" font-size="9">Deterministic and auditable</text>
    <path d="M374 258h254M374 297h254M374 336h254" stroke="#243b36"/>
    <g font-size="11">
      <circle cx="383" cy="278" r="3" fill="#52e2bc"/>
      <text x="398" y="282" fill="#a9b8b4">Validate and preserve STIX objects</text>
      <circle cx="383" cy="317" r="3" fill="#52e2bc"/>
      <text x="398" y="321" fill="#a9b8b4">Canonicalize and deduplicate IOC</text>
      <circle cx="383" cy="356" r="3" fill="#52e2bc"/>
      <text x="398" y="360" fill="#a9b8b4">Mask sensitive values when required</text>
    </g>

    <!-- graph card -->
    <rect x="698" y="180" width="332" height="210" rx="14" fill="url(#graph-card)" stroke="#33445d"/>
    <text x="720" y="211" fill="#dce5ef" font-size="14" font-weight="700">Evidence-backed graph core</text>
    <text x="720" y="229" fill="#6c7d91" font-size="9">Neo4j · 17 entity types · 13 relationships</text>
    <g stroke-linecap="round">
      <path d="M764 292 858 258 948 291M764 292 838 344M858 258 838 344M948 291 838 344" fill="none" stroke="#52647a" stroke-width="1.4"/>
      <path d="M764 292 858 258" stroke="#ff6577" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="764" cy="292" r="24" fill="#132b27" stroke="#52e2bc" stroke-width="1.6"/>
      <circle cx="858" cy="258" r="27" fill="#2b1b23" stroke="#ff6577" stroke-width="1.7" filter="url(#glow)"/>
      <circle cx="948" cy="291" r="23" fill="#172641" stroke="#67a4ff" stroke-width="1.6"/>
      <circle cx="838" cy="344" r="23" fill="#281d38" stroke="#b37cff" stroke-width="1.6"/>
      <text x="764" y="296" fill="#72dfc3" font-size="10" font-weight="700" text-anchor="middle">Asset</text>
      <text x="858" y="262" fill="#ff8492" font-size="9" font-weight="700" text-anchor="middle">Incident</text>
      <text x="948" y="295" fill="#7db0ff" font-size="10" font-weight="700" text-anchor="middle">IOC</text>
      <text x="838" y="348" fill="#c29bff" font-size="9" font-weight="700" text-anchor="middle">T1003</text>
    </g>
    <rect x="914" y="346" width="92" height="24" rx="12" fill="#13231f" stroke="#2f6155"/>
    <circle cx="930" cy="358" r="4" fill="#52e2bc"/>
    <text x="941" y="361.5" fill="#8fb7ad" font-size="8" font-weight="650">Evidence</text>

    <!-- investigate card -->
    <rect x="1078" y="180" width="302" height="210" rx="14" fill="#111821" stroke="#2a3542"/>
    <g transform="translate(1100 202)">
      <rect width="258" height="48" rx="9" fill="#162029" stroke="#304050"/>
      <rect x="13" y="12" width="24" height="24" rx="6" fill="#192d3e" stroke="#3c6685"/>
      <path d="M19 29V19h12v10M19 24h12" fill="none" stroke="#72b3e5" stroke-width="1.2"/>
      <text x="51" y="21" fill="#d7e1ea" font-size="11" font-weight="650">Workspace Graph API</text>
      <text x="51" y="35" fill="#657483" font-size="8">Bounded query · sensitive masking</text>
    </g>
    <g transform="translate(1100 261)">
      <rect width="258" height="48" rx="9" fill="#16251f" stroke="#31564c"/>
      <rect x="13" y="12" width="24" height="24" rx="6" fill="#17332b" stroke="#347060"/>
      <path d="M19 29h12M19 25l4-4 3 3 5-7" fill="none" stroke="#52e2bc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="51" y="21" fill="#e0ebe8" font-size="11" font-weight="650">Investigation dashboard</text>
      <text x="51" y="35" fill="#66817a" font-size="8">Search · filter · timeline · export</text>
    </g>
    <g transform="translate(1100 320)">
      <rect width="258" height="48" rx="9" fill="#211a29" stroke="#4b395d"/>
      <rect x="13" y="12" width="24" height="24" rx="6" fill="#2d2039" stroke="#654887"/>
      <path d="M20 19h10M20 23h7M20 27h9" stroke="#c49aef" stroke-width="1.3" stroke-linecap="round"/>
      <text x="51" y="21" fill="#e1d8e9" font-size="11" font-weight="650">Grounded analyst context</text>
      <text x="51" y="35" fill="#796d83" font-size="8">Confidence · source · observed time</text>
    </g>

    <!-- arrows -->
    <path d="M314 285h23" stroke="#52e2bc" stroke-width="1.7" marker-end="url(#arrow)"/>
    <path d="M662 285h23" stroke="#52e2bc" stroke-width="1.7" marker-end="url(#arrow)"/>
    <path d="M1040 285h25" stroke="#52e2bc" stroke-width="1.7" marker-end="url(#arrow)"/>

    <!-- infrastructure rail -->
    <rect x="60" y="426" width="1320" height="82" rx="13" fill="#0e151d" stroke="#26323e"/>
    <text x="82" y="453" fill="#617080" font-size="9" font-weight="700" letter-spacing="1.5">RUNTIME FOUNDATION</text>
    <g transform="translate(82 467)">
      <rect width="250" height="24" rx="6" fill="#141e28"/>
      <circle cx="14" cy="12" r="4" fill="#5e9eff"/>
      <text x="27" y="15.5" fill="#94a3b3" font-size="9">PostgreSQL · metadata and jobs</text>
    </g>
    <g transform="translate(353 467)">
      <rect width="250" height="24" rx="6" fill="#141e28"/>
      <circle cx="14" cy="12" r="4" fill="#ff6577"/>
      <text x="27" y="15.5" fill="#94a3b3" font-size="9">Redis + Celery · async runtime</text>
    </g>
    <g transform="translate(624 467)">
      <rect width="250" height="24" rx="6" fill="#141e28"/>
      <circle cx="14" cy="12" r="4" fill="#52e2bc"/>
      <text x="27" y="15.5" fill="#94a3b3" font-size="9">FastAPI · typed service boundary</text>
    </g>
    <g transform="translate(895 467)">
      <rect width="250" height="24" rx="6" fill="#141e28"/>
      <circle cx="14" cy="12" r="4" fill="#b37cff"/>
      <text x="27" y="15.5" fill="#94a3b3" font-size="9">React / Vite · interactive UI</text>
    </g>
    <g transform="translate(1166 467)">
      <rect width="192" height="24" rx="6" fill="#14221f" stroke="#29463f"/>
      <circle cx="14" cy="12" r="4" fill="#52e2bc"/>
      <text x="27" y="15.5" fill="#8eadA5" font-size="9">Docker Compose</text>
    </g>
  </g>
</svg>
