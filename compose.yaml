name: threatgraph

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-threatgraph}:${POSTGRES_PASSWORD:-threatgraph-development-only}@postgres:5432/${POSTGRES_DB:-threatgraph}
  NEO4J_URI: neo4j://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-threatgraph-development-only}
  REDIS_URL: redis://:${REDIS_PASSWORD:-threatgraph-development-only}@redis:6379/0
  CORS_ORIGINS: '["http://localhost:${WEB_PORT:-5173}"]'

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  environment: *backend-environment
  depends_on:
    postgres:
      condition: service_healthy
    neo4j:
      condition: service_healthy
    redis:
      condition: service_healthy
    graph-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatgraph-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-threatgraph}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-threatgraph-development-only}
      HEALTHCHECK_NEO4J_USER: ${NEO4J_USER:-neo4j}
      HEALTHCHECK_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-threatgraph-development-only}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u $${HEALTHCHECK_NEO4J_USER} -p $${HEALTHCHECK_NEO4J_PASSWORD} 'RETURN 1' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-threatgraph-development-only}
    command:
      ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  graph-init:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment: *backend-environment
    command: ["threatgraph-schema"]
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    command: ["uvicorn", "threatgraph.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend-service
    command: ["celery", "--app", "threatgraph.worker.celery_app:celery_app", "worker", "--loglevel", "INFO"]
    healthcheck:
      disable: true

  web:
    build:
      context: web
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
  redis-data:
